rule: detections/rules/identity_ai_service_app_credential_add.yaml
table: AuditLogs
positive_cases:
  - name: New client secret added to enterprise AI service application
    rows:
      - TimeGenerated: "2026-10-15T11:00:00Z"
        OperationName: "Update application - Certificates and secrets management"
        Result: "success"
        InitiatedBy:
          user:
            userPrincipalName: "ops.admin@example.com.au"
        TargetResources:
          - displayName: "Enterprise-AI-Assistant-Connector"
negative_cases:
  - name: Failed credential update attempt
    rows:
      - TimeGenerated: "2026-10-15T11:05:00Z"
        OperationName: "Update application - Certificates and secrets management"
        Result: "failure"
        InitiatedBy:
          user:
            userPrincipalName: "user@example.com.au"
        TargetResources:
          - displayName: "Enterprise-AI-Assistant-Connector"
