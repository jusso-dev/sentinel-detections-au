id: acsc-2026-10-23-fortinet-critical-vulnerabilities
title: Critical vulnerabilities in Fortinet products
date: "2026-10-23"
source: alerts
link: https://www.cyber.gov.au/alert/critical-vulnerabilities-in-fortinet-products
status: mapped
needs_human_review: false
summary: >-
  ASD's ACSC alert advising organisations to urgently patch critical vulnerabilities in
  Fortinet appliances. Because edge devices often lack endpoint agents, Sentinel and Defender
  XDR detections focus on firewall syslog authentication anomalies and unexpected internal
  SMB or remote administration connections originating from gateway and DMZ addresses.
attack_techniques:
  - T1190
  - T1133
  - T1110
  - T1021.002
affected_products:
  - Fortinet FortiGate
  - Fortinet FortiOS
  - Fortinet FortiManager
