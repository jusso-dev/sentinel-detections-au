summary: >-
  ASD's ACSC alert concerning two critical vulnerabilities disclosed in PHP impacting web
  applications. Microsoft Defender XDR and Sentinel coverage targets PHP worker processes
  spawning interactive shells or command interpreters, and unexpected script files written
  into webroot directories.
