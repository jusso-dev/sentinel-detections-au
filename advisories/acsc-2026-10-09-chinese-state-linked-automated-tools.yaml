id: acsc-2026-10-09-chinese-state-linked-automated-tools
title: Chinese government-linked cyber threat actors combine automated and hands-on hacking tools to steal sensitive data
date: "2026-10-09"
source: advisories
link: https://www.cyber.gov.au/advisory/chinese-government-linked-cyber-threat-actors-combine-automated-and-hands-on-hacking-tools-to-steal-sensitive-data
status: mapped
needs_human_review: false
summary: >-
  ASD's ACSC advisory explaining how Chinese state-linked actors pair automated vulnerability
  exploitation and reconnaissance tooling with hands-on post-exploitation activity to collect
  and exfiltrate sensitive organisational data. Defenders using Microsoft Sentinel and
  Microsoft Defender XDR should monitor for internet-facing service exploitation follow-on
  shells, credential harvesting, archive staging and anomalous outbound transfers.
attack_techniques:
  - T1190
  - T1059.001
  - T1003.001
  - T1560.001
  - T1041
affected_products:
  - Internet-facing web applications
  - Edge network appliances
  - Microsoft Windows
  - Linux
