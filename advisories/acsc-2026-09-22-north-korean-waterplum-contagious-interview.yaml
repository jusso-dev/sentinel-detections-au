status: mapped
needs_human_review: false
summary: >-
  Joint cyber security advisory describing North Korean threat actors (WaterPlum / Contagious
  Interview) targeting software engineers and IT staff through fraudulent coding assessments
  that execute trojanised Node.js or Python scripts to harvest browser credentials and wallet
  data. Defender XDR detections monitor suspicious developer runtime child shells and
  non-browser processes reading browser login stores.
