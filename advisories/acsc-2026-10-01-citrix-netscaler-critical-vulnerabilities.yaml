summary: >-
  High-priority ASD's ACSC alert warning organisations to patch actively exploited critical
  vulnerabilities in Citrix NetScaler ADC and Citrix NetScaler Gateway appliances. For
  Microsoft Sentinel and Defender XDR teams, detection priorities include suspicious
  post-exploitation authentication patterns, unusual session reuse, web shell follow-on
  activity and unexpected lateral connections originating from gateway or DMZ subnets.
