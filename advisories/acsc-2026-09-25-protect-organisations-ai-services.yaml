id: acsc-2026-09-25-protect-organisations-ai-services
title: Protect your organisations' AI services
date: "2026-09-25"
source: advisories
link: https://www.cyber.gov.au/advisory/protect-your-organisations-ai-services
status: mapped
needs_human_review: false
summary: >-
  ASD's ACSC advisory detailing how organisations should secure identities, API keys, service
  principals and connected data sources backing enterprise AI services. Sentinel detections
  focus on unauthorised credential additions to Microsoft Entra ID applications and high-risk
  OAuth permission grants that could expose enterprise data to AI connectors or external apps.
attack_techniques:
  - T1098.001
  - T1528
  - T1550.001
affected_products:
  - Enterprise AI platforms
  - Microsoft Entra ID
  - Cloud API gateways
iocs:
  published: false
  notes: >-
    Defensive guidance focused on identity hygiene, least privilege and credential monitoring.
ism_controls:
  - ISM-0580
  - ISM-1405
  - ISM-1504
  - ISM-1657
linked_detections:
