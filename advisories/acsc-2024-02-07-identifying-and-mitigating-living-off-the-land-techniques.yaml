status: reviewed
needs_human_review: false
summary: >-
  Joint international guidance co-authored by ASD's ACSC and partner agencies detailing how
  advanced persistent threat actors abuse built-in administrative tools, scripting engines and
  valid accounts to evade conventional malware detection. For Microsoft Defender XDR and
  Microsoft Sentinel defenders, coverage centres on process creation telemetry, command-line
  auditing, PowerShell logging, credential access monitoring and baselining native utilities.
