id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e14
name: Non-Browser Process Accessing Browser Credential Stores
description: 'Detects scripting runtimes or untrusted binaries interacting with Chromium or Firefox credential
  and profile database files, consistent with stealer payloads used by WaterPlum. ISM controls: ISM-0580,
  ISM-1405, ISM-1657. Advisories: acsc-2026-09-22-north-korean-waterplum-contagious-interview.'
severity: High
status: Available
kind: Scheduled
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1555.003
query: 'DeviceFileEvents

  | where FileName in~ ("Login Data", "Local State", "logins.json", "key4.db")

  | where FolderPath has_any ("Chrome\\User Data", "Edge\\User Data", "Firefox\\Profiles", "Google/Chrome",
  "BraveSoftware")

  | where InitiatingProcessFileName in~ ("node.exe", "node", "python.exe", "python3", "powershell.exe",
  "pwsh.exe", "cmd.exe")

  | project Timestamp, DeviceId, DeviceName, InitiatingProcessFileName, FolderPath, FileName, ReportId

  '
version: 1.0.0
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceFileEvents
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: File
  fieldMappings:
  - identifier: Name
    columnName: FileName
