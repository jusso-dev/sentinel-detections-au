id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e02
name: Active Directory NTDS.dit Extraction via Ntdsutil IFM
description: 'Detects ntdsutil.exe invoked with Install From Media (IFM) arguments to dump the Active
  Directory NTDS.dit database, a living off the land credential theft technique highlighted in ASD/ACSC
  guidance. ISM controls: ISM-0580, ISM-1405, ISM-1657. Advisories: acsc-2024-02-07-identifying-and-mitigating-living-off-the-land-techniques,
  acsc-2026-10-09-chinese-state-linked-automated-tools.'
severity: High
status: Available
kind: Scheduled
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
- CredentialAccess
relevantTechniques:
- T1003.003
query: 'DeviceProcessEvents

  | where FileName =~ "ntdsutil.exe"

  | where ProcessCommandLine has_any ("ifm", "create full", "ac i ntds", "activate instance ntds")

  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine,
  ReportId

  '
version: 1.0.0
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: AccountName
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: ProcessCommandLine
