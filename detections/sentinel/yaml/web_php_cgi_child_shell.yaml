id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e07
name: PHP Runtime Spawning Interactive Shell or Download Utility
description: 'Detects PHP interpreter or PHP-FPM/CGI worker processes launching OS shells or network download
  utilities, indicating exploitation of critical PHP vulnerabilities. ISM controls: ISM-0580, ISM-1144,
  ISM-1405, ISM-1690. Advisories: acsc-2026-10-21-php-critical-vulnerabilities, acsc-2026-11-17-vulnerabilities-patch-protect-prevent.'
severity: High
status: Available
kind: Scheduled
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
- InitialAccess
- Execution
relevantTechniques:
- T1190
- T1059.004
query: 'DeviceProcessEvents

  | where InitiatingProcessFileName has_any ("php", "php-cgi", "php-fpm")

  | where FileName in~ ("sh", "bash", "dash", "cmd.exe", "powershell.exe", "curl", "wget", "python3",
  "perl")

  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine,
  ReportId

  '
version: 1.0.0
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: ProcessCommandLine
