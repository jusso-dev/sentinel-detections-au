id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e19
name: Netsh Portproxy Tunnel Configuration
description: 'Detects netsh.exe creating IPv4/IPv6 portproxy forwarding rules to pivot traffic through
  compromised Windows hosts, a hallmark living off the land proxying technique noted in ASD/ACSC joint
  guidance. ISM controls: ISM-0580, ISM-1405, ISM-1621. Advisories: acsc-2024-02-07-identifying-and-mitigating-living-off-the-land-techniques.'
severity: High
status: Available
kind: Scheduled
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
- CommandAndControl
relevantTechniques:
- T1090.001
query: 'DeviceProcessEvents

  | where FileName =~ "netsh.exe"

  | where ProcessCommandLine has_all ("interface", "portproxy", "add")

  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine,
  ReportId

  '
version: 1.0.0
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: AccountName
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: ProcessCommandLine
