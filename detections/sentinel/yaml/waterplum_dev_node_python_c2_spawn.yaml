id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e13
name: Suspicious Node.js or Python Developer Runtime Spawning Obfuscated Shell
description: 'Detects Node.js, npm or Python developer runtimes executing remote download or encoded shell
  commands, matching WaterPlum (Contagious Interview) tradecraft targeting IT staff. ISM controls: ISM-0580,
  ISM-0843, ISM-1405, ISM-1621. Advisories: acsc-2026-09-22-north-korean-waterplum-contagious-interview.'
severity: High
status: Available
kind: Scheduled
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
- Execution
relevantTechniques:
- T1059.007
- T1059.006
query: 'DeviceProcessEvents

  | where InitiatingProcessFileName in~ ("node.exe", "node", "npm", "npx", "python.exe", "python3")

  | where FileName in~ ("powershell.exe", "pwsh.exe", "cmd.exe", "sh", "bash", "curl", "wget")

  | where ProcessCommandLine has_any ("-enc", "base64", "eval(", "curl ", "wget ", "http://", "https://")

  | where ProcessCommandLine has_any ("| sh", "| bash", "iex", "invoke-expression", "-enc", "base64")

  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine,
  ReportId

  '
version: 1.0.0
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: AccountName
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: ProcessCommandLine
