id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e15
name: Microsoft Defender Antivirus Exclusion Added via Command Line
description: 'Detects PowerShell Add-MpPreference commands or registry modifications adding exclusions
  to Microsoft Defender Antivirus, commonly performed by crypted malware loaders to evade scans. ISM controls:
  ISM-0580, ISM-0843, ISM-1405, ISM-1621. Advisories: acsc-2026-09-08-digital-camouflage-crypters-malware.'
severity: High
status: Available
kind: Scheduled
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
relevantTechniques:
- T1027
- T1112
query: 'DeviceProcessEvents

  | where FileName in~ ("powershell.exe", "pwsh.exe", "cmd.exe", "reg.exe")

  | where ProcessCommandLine has_any ("Add-MpPreference", "Set-MpPreference", "Windows Defender\\Exclusions")

  | where ProcessCommandLine has_any ("ExclusionPath", "ExclusionProcess", "ExclusionExtension", "DisableRealtimeMonitoring",
  "Exclusions\\Paths")

  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine,
  ReportId

  '
version: 1.0.0
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: AccountName
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: ProcessCommandLine
