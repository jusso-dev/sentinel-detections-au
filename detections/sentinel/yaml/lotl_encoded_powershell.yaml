id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e01
name: Encoded PowerShell Execution via Living off the Land
description: 'Detects powershell.exe or pwsh.exe launched with encoded command flags, a common living
  off the land execution technique highlighted in ASD/ACSC joint guidance. ISM controls: ISM-1621, ISM-0580,
  ISM-1405. Advisories: acsc-2024-02-07-identifying-and-mitigating-living-off-the-land-techniques.'
severity: Medium
status: Available
kind: Scheduled
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
- Execution
relevantTechniques:
- T1059.001
query: 'DeviceProcessEvents

  | where FileName in~ ("powershell.exe", "pwsh.exe")

  | where ProcessCommandLine has_any ("-enc ", "-encodedcommand ", " -e ", " -ec ")

  | where not(InitiatingProcessFileName in~ ("ccmexec.exe", "intunemanagementextension.exe"))

  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine,
  ReportId

  '
version: 1.0.0
requiredDataConnectors:
- connectorId: MicrosoftThreatProtection
  dataTypes:
  - DeviceProcessEvents
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: DeviceName
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: AccountName
- entityType: Process
  fieldMappings:
  - identifier: CommandLine
    columnName: ProcessCommandLine
