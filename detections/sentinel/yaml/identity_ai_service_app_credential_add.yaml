id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e11
name: Credential Added to Microsoft Entra ID Application or Service Principal
description: 'Detects addition of new secrets or certificates to Microsoft Entra ID applications or service
  principals, including identities used to access organisational AI services. ISM controls: ISM-0580,
  ISM-1405, ISM-1504, ISM-1657. Advisories: acsc-2026-09-25-protect-organisations-ai-services.'
severity: High
status: Available
kind: Scheduled
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
tactics:
- Persistence
- PrivilegeEscalation
relevantTechniques:
- T1098.001
query: 'AuditLogs

  | where OperationName has_any ("Update application - Certificates and secrets management", "Add service
  principal credentials", "Update service principal")

  | where Result == "success"

  | extend InitiatingUser = tostring(InitiatedBy.user.userPrincipalName)

  | extend TargetAppName = tostring(TargetResources[0].displayName)

  | where isnotempty(TargetAppName)

  | project TimeGenerated, OperationName, InitiatingUser, TargetAppName, Result

  '
version: 1.0.0
requiredDataConnectors:
- connectorId: AzureActiveDirectory
  dataTypes:
  - AuditLogs
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: FullName
    columnName: InitiatingUser
- entityType: CloudApplication
  fieldMappings:
  - identifier: Name
    columnName: TargetAppName
