id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e13
name: Suspicious Node.js or Python Developer Runtime Spawning Obfuscated Shell
description: >-
  Detects Node.js, npm or Python developer runtimes executing remote download or encoded
  shell commands, matching WaterPlum (Contagious Interview) tradecraft targeting IT staff.
author: sentinel-detections-au
version: 1.0.0
severity: High
status: production
targets:
  - sentinel
  - defender_xdr
query_frequency: PT1H
query_period: PT1H
trigger_operator: gt
trigger_threshold: 0
tactics:
  - Execution
techniques:
  - T1059.007
  - T1059.006
ism_controls:
  - ISM-0580
  - ISM-0843
  - ISM-1405
  - ISM-1621
advisories:
  - acsc-2026-09-22-north-korean-waterplum-contagious-interview
tables:
  - DeviceProcessEvents
required_data_connectors:
  - connector_id: MicrosoftThreatProtection
    data_types:
      - DeviceProcessEvents
entity_mappings:
  - entity_type: Host
    field_mappings:
      - identifier: HostName
        column_name: DeviceName
  - entity_type: Account
    field_mappings:
      - identifier: Name
        column_name: AccountName
  - entity_type: Process
    field_mappings:
      - identifier: CommandLine
        column_name: ProcessCommandLine
defender_xdr:
  period: 1H
  category: Execution
  recommended_actions: >-
    Inspect the parent npm package or Python script on the developer workstation, check for
    untrusted cloned repositories, and rotate developer SSH keys and cloud tokens.
  impacted_assets:
    - type: device
      identifier: deviceId
      column: DeviceId
query: |
  DeviceProcessEvents
  | where InitiatingProcessFileName in~ ("node.exe", "node", "npm", "npx", "python.exe", "python3")
  | where FileName in~ ("powershell.exe", "pwsh.exe", "cmd.exe", "sh", "bash", "curl", "wget")
  | where ProcessCommandLine has_any ("-enc", "base64", "eval(", "curl ", "wget ", "http://", "https://")
  | where ProcessCommandLine has_any ("| sh", "| bash", "iex", "invoke-expression", "-enc", "base64")
  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine, ReportId
false_positives:
  - Developer build scripts using curl piped to shell installers during toolchain setup.
references:
  - https://www.cyber.gov.au/advisory/north-korean-waterplum-commonly-referred-to-as-contagious-interview-cyber-actor-group-targeting-it-professionals
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
