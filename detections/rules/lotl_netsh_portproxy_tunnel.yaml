id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e19
name: Netsh Portproxy Tunnel Configuration
description: >-
  Detects netsh.exe creating IPv4/IPv6 portproxy forwarding rules to pivot traffic through
  compromised Windows hosts, a hallmark living off the land proxying technique noted in
  ASD/ACSC joint guidance.
author: sentinel-detections-au
version: 1.0.0
severity: High
status: production
targets:
  - sentinel
  - defender_xdr
query_frequency: PT1H
query_period: PT1H
trigger_operator: gt
trigger_threshold: 0
tactics:
  - CommandAndControl
techniques:
  - T1090.001
ism_controls:
  - ISM-0580
  - ISM-1405
  - ISM-1621
advisories:
  - acsc-2024-02-07-identifying-and-mitigating-living-off-the-land-techniques
tables:
  - DeviceProcessEvents
required_data_connectors:
  - connector_id: MicrosoftThreatProtection
    data_types:
      - DeviceProcessEvents
entity_mappings:
  - entity_type: Host
    field_mappings:
      - identifier: HostName
        column_name: DeviceName
  - entity_type: Account
    field_mappings:
      - identifier: Name
        column_name: AccountName
  - entity_type: Process
    field_mappings:
      - identifier: CommandLine
        column_name: ProcessCommandLine
defender_xdr:
  period: 1H
  category: CommandAndControl
  recommended_actions: >-
    List active portproxy mappings on the host, remove unauthorised forwarding rules, and
    inspect connected internal and external endpoints for lateral movement.
  impacted_assets:
    - type: device
      identifier: deviceId
      column: DeviceId
query: |
  DeviceProcessEvents
  | where FileName =~ "netsh.exe"
  | where ProcessCommandLine has_all ("interface", "portproxy", "add")
  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine, ReportId
false_positives:
  - Authorised network engineering tests configuring local port forwarding on jump servers.
references:
  - https://www.cyber.gov.au/advisory/identifying-and-mitigating-living-off-the-land-techniques
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
