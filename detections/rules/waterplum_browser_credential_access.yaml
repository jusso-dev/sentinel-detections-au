id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e14
name: Non-Browser Process Accessing Browser Credential Stores
description: >-
  Detects scripting runtimes or untrusted binaries interacting with Chromium or Firefox
  credential and profile database files, consistent with stealer payloads used by WaterPlum.
author: sentinel-detections-au
version: 1.0.0
severity: High
status: production
targets:
  - sentinel
  - defender_xdr
query_frequency: PT1H
query_period: PT1H
trigger_operator: gt
trigger_threshold: 0
tactics:
  - CredentialAccess
techniques:
  - T1555.003
ism_controls:
  - ISM-0580
  - ISM-1405
  - ISM-1657
advisories:
  - acsc-2026-09-22-north-korean-waterplum-contagious-interview
tables:
  - DeviceFileEvents
required_data_connectors:
  - connector_id: MicrosoftThreatProtection
    data_types:
      - DeviceFileEvents
entity_mappings:
  - entity_type: Host
    field_mappings:
      - identifier: HostName
        column_name: DeviceName
  - entity_type: File
    field_mappings:
      - identifier: Name
        column_name: FileName
defender_xdr:
  period: 1H
  category: CredentialAccess
  recommended_actions: >-
    Isolate the workstation, inspect the initiating script or binary, and revoke active
    browser sessions and saved credentials for the affected user.
  impacted_assets:
    - type: device
      identifier: deviceId
      column: DeviceId
query: |
  DeviceFileEvents
  | where FileName in~ ("Login Data", "Local State", "logins.json", "key4.db")
  | where FolderPath has_any ("Chrome\\User Data", "Edge\\User Data", "Firefox\\Profiles", "Google/Chrome", "BraveSoftware")
  | where InitiatingProcessFileName in~ ("node.exe", "node", "python.exe", "python3", "powershell.exe", "pwsh.exe", "cmd.exe")
  | project Timestamp, DeviceId, DeviceName, InitiatingProcessFileName, FolderPath, FileName, ReportId
false_positives:
  - Endpoint migration utilities copying browser profiles under IT supervision.
references:
  - https://www.cyber.gov.au/advisory/north-korean-waterplum-commonly-referred-to-as-contagious-interview-cyber-actor-group-targeting-it-professionals
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-devicefileevents-table
