id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e02
name: Active Directory NTDS.dit Extraction via Ntdsutil IFM
description: >-
  Detects ntdsutil.exe invoked with Install From Media (IFM) arguments to dump the Active
  Directory NTDS.dit database, a living off the land credential theft technique highlighted
  in ASD/ACSC guidance.
author: sentinel-detections-au
version: 1.0.0
severity: High
status: production
targets:
  - sentinel
  - defender_xdr
query_frequency: PT1H
query_period: PT1H
trigger_operator: gt
trigger_threshold: 0
tactics:
  - CredentialAccess
techniques:
  - T1003.003
ism_controls:
  - ISM-0580
  - ISM-1405
  - ISM-1657
advisories:
  - acsc-2024-02-07-identifying-and-mitigating-living-off-the-land-techniques
  - acsc-2026-10-09-chinese-state-linked-automated-tools
tables:
  - DeviceProcessEvents
required_data_connectors:
  - connector_id: MicrosoftThreatProtection
    data_types:
      - DeviceProcessEvents
entity_mappings:
  - entity_type: Host
    field_mappings:
      - identifier: HostName
        column_name: DeviceName
  - entity_type: Account
    field_mappings:
      - identifier: Name
        column_name: AccountName
  - entity_type: Process
    field_mappings:
      - identifier: CommandLine
        column_name: ProcessCommandLine
defender_xdr:
  period: 1H
  category: CredentialAccess
  recommended_actions: >-
    Verify whether an authorised domain controller backup or IFM promotion is underway; if
    unauthorised, isolate the host and reset KRBTGT and privileged credentials immediately.
  impacted_assets:
    - type: device
      identifier: deviceId
      column: DeviceId
query: |
  DeviceProcessEvents
  | where FileName =~ "ntdsutil.exe"
  | where ProcessCommandLine has_any ("ifm", "create full", "ac i ntds", "activate instance ntds")
  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine, ReportId
false_positives:
  - Authorised domain controller staging using Install From Media during planned maintenance.
references:
  - https://www.cyber.gov.au/advisory/identifying-and-mitigating-living-off-the-land-techniques
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
