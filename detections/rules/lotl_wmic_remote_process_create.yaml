id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e21
name: Remote Process Creation via WMIC
description: >-
  Detects wmic.exe executing process call create against remote hosts (/node:), a living
  off the land lateral movement and execution technique covered in ASD/ACSC joint guidance.
author: sentinel-detections-au
version: 1.0.0
severity: High
status: production
targets:
  - sentinel
  - defender_xdr
query_frequency: PT1H
query_period: PT1H
trigger_operator: gt
trigger_threshold: 0
tactics:
  - Execution
techniques:
  - T1047
ism_controls:
  - ISM-0580
  - ISM-1405
  - ISM-1621
  - ISM-1657
advisories:
  - acsc-2024-02-07-identifying-and-mitigating-living-off-the-land-techniques
tables:
  - DeviceProcessEvents
required_data_connectors:
  - connector_id: MicrosoftThreatProtection
    data_types:
      - DeviceProcessEvents
entity_mappings:
  - entity_type: Host
    field_mappings:
      - identifier: HostName
        column_name: DeviceName
  - entity_type: Account
    field_mappings:
      - identifier: Name
        column_name: AccountName
  - entity_type: Process
    field_mappings:
      - identifier: CommandLine
        column_name: ProcessCommandLine
defender_xdr:
  period: 1H
  category: Execution
  recommended_actions: >-
    Verify whether the initiating account is authorised for remote WMI administration and
    inspect the target host for spawned processes.
  impacted_assets:
    - type: device
      identifier: deviceId
      column: DeviceId
query: |
  DeviceProcessEvents
  | where FileName =~ "wmic.exe"
  | where ProcessCommandLine has_all ("/node:", "process", "call", "create")
  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine, ReportId
false_positives:
  - Legacy IT management scripts using WMIC for remote software inventory or patching.
references:
  - https://www.cyber.gov.au/advisory/identifying-and-mitigating-living-off-the-land-techniques
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
