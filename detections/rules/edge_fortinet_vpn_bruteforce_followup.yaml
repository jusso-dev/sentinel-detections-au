id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e06
name: Edge VPN Brute Force Followed by Successful Authentication
description: >-
  Detects repeated authentication failures against Fortinet or Citrix perimeter gateways in
  CommonSecurityLog followed by a successful login from the same source IP address.
author: sentinel-detections-au
version: 1.0.0
severity: High
status: production
targets:
  - sentinel
query_frequency: PT1H
query_period: PT1H
trigger_operator: gt
trigger_threshold: 0
tactics:
  - InitialAccess
  - CredentialAccess
techniques:
  - T1133
  - T1110
ism_controls:
  - ISM-0580
  - ISM-1405
  - ISM-1504
  - ISM-1690
advisories:
  - acsc-2026-10-23-fortinet-critical-vulnerabilities
  - acsc-2026-10-01-citrix-netscaler-critical-vulnerabilities
tables:
  - CommonSecurityLog
required_data_connectors:
  - connector_id: Fortinet
    data_types:
      - CommonSecurityLog
  - connector_id: CitrixADC
    data_types:
      - CommonSecurityLog
entity_mappings:
  - entity_type: IP
    field_mappings:
      - identifier: Address
        column_name: SourceIP
  - entity_type: Account
    field_mappings:
      - identifier: Name
        column_name: DestinationUserName
query: |
  CommonSecurityLog
  | where DeviceVendor in~ ("Fortinet", "Citrix")
  | where Activity has_any ("ssl-login", "vpn", "login", "authentication")
  | summarize
      FailedAttempts = countif(DeviceAction has_any ("fail", "deny", "blocked", "ssl-login-fail")),
      SuccessAttempts = countif(DeviceAction has_any ("success", "allow", "tunnel-up", "ssl-login-ok")),
      Users = make_set(DestinationUserName, 10)
      by SourceIP, DeviceVendor
  | where FailedAttempts >= 5 and SuccessAttempts >= 1
  | extend DestinationUserName = tostring(Users[0])
  | project SourceIP, DeviceVendor, FailedAttempts, SuccessAttempts, DestinationUserName
false_positives:
  - Users mistyping VPN passwords behind a shared corporate NAT gateway.
references:
  - https://www.cyber.gov.au/alert/critical-vulnerabilities-in-fortinet-products
  - https://learn.microsoft.com/en-us/azure/sentinel/data-connectors/fortinet
