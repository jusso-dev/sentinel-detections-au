id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e16
name: Suspicious Exchange Online Inbox Forwarding or Hiding Rule Created
description: >-
  Detects creation or modification of Exchange Online inbox rules that forward email
  externally or hide messages in RSS or Deleted Items folders following credential phishing.
author: sentinel-detections-au
version: 1.0.0
severity: High
status: production
targets:
  - sentinel
  - defender_xdr
query_frequency: PT1H
query_period: PT1H
trigger_operator: gt
trigger_threshold: 0
tactics:
  - Collection
  - InitialAccess
techniques:
  - T1114.003
  - T1566.002
ism_controls:
  - ISM-0580
  - ISM-1405
  - ISM-1504
advisories:
  - acsc-2026-09-08-russian-state-phishing-zimbra
tables:
  - CloudAppEvents
required_data_connectors:
  - connector_id: MicrosoftThreatProtection
    data_types:
      - CloudAppEvents
entity_mappings:
  - entity_type: Account
    field_mappings:
      - identifier: FullName
        column_name: AccountDisplayName
  - entity_type: IP
    field_mappings:
      - identifier: Address
        column_name: IPAddress
defender_xdr:
  period: 1H
  category: Collection
  recommended_actions: >-
    Review the mailbox rule parameters, check recent sign-ins for the user account, remove
    unauthorised forwarding rules, and revoke active refresh tokens.
  impacted_assets:
    - type: user
      identifier: aadObjectId
      column: AccountObjectId
query: |
  CloudAppEvents
  | where ActionType in ("New-InboxRule", "Set-InboxRule", "Set-Mailbox")
  | extend RuleData = tostring(RawEventData)
  | where RuleData has_any ("ForwardTo", "ForwardAsAttachmentTo", "RedirectTo", "ForwardingSmtpAddress", "MarkAsRead", "MoveToFolder")
  | where RuleData has_any ("ForwardTo", "ForwardAsAttachmentTo", "RedirectTo", "ForwardingSmtpAddress", "RSS Feeds", "Deleted Items", "Conversation History")
  | project Timestamp, AccountObjectId, AccountDisplayName, ActionType, IPAddress, CountryCode, RuleData, ReportId
false_positives:
  - Users configuring legitimate auto-forwarding rules where permitted by organisational policy.
references:
  - https://www.cyber.gov.au/advisory/russian-state-supported-cyber-actors-conduct-phishing-campaign-targeting-users-of-zimbra-collaboration-suite
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-cloudappevents-table
