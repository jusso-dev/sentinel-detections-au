id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e11
name: Credential Added to Microsoft Entra ID Application or Service Principal
description: >-
  Detects addition of new secrets or certificates to Microsoft Entra ID applications or
  service principals, including identities used to access organisational AI services.
author: sentinel-detections-au
version: 1.0.0
severity: High
status: production
targets:
  - sentinel
query_frequency: PT1H
query_period: PT1H
trigger_operator: gt
trigger_threshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
techniques:
  - T1098.001
ism_controls:
  - ISM-0580
  - ISM-1405
  - ISM-1504
  - ISM-1657
advisories:
  - acsc-2026-09-25-protect-organisations-ai-services
tables:
  - AuditLogs
required_data_connectors:
  - connector_id: AzureActiveDirectory
    data_types:
      - AuditLogs
entity_mappings:
  - entity_type: Account
    field_mappings:
      - identifier: FullName
        column_name: InitiatingUser
  - entity_type: CloudApplication
    field_mappings:
      - identifier: Name
        column_name: TargetAppName
query: |
  AuditLogs
  | where OperationName has_any ("Update application - Certificates and secrets management", "Add service principal credentials", "Update service principal")
  | where Result == "success"
  | extend InitiatingUser = tostring(InitiatedBy.user.userPrincipalName)
  | extend TargetAppName = tostring(TargetResources[0].displayName)
  | where isnotempty(TargetAppName)
  | project TimeGenerated, OperationName, InitiatingUser, TargetAppName, Result
false_positives:
  - Planned secret or certificate rotation performed by platform or identity engineers.
references:
  - https://www.cyber.gov.au/advisory/protect-your-organisations-ai-services
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
