id: 6d4e0e1b-8b6a-4f3d-9c2a-1a0b3c4d5e04
name: Web Server Process Spawning Command Shell (Web Shell Follow-On)
description: >-
  Detects web server or application gateway worker processes spawning command shells or
  reconnaissance binaries, indicative of web shell execution following exploitation of
  internet-facing applications or appliances.
author: sentinel-detections-au
version: 1.0.0
severity: High
status: production
targets:
  - sentinel
  - defender_xdr
query_frequency: PT1H
query_period: PT1H
trigger_operator: gt
trigger_threshold: 0
tactics:
  - InitialAccess
  - Persistence
techniques:
  - T1190
  - T1505.003
ism_controls:
  - ISM-0580
  - ISM-1144
  - ISM-1405
advisories:
  - acsc-2026-10-01-citrix-netscaler-critical-vulnerabilities
  - acsc-2026-11-17-vulnerabilities-patch-protect-prevent
tables:
  - DeviceProcessEvents
required_data_connectors:
  - connector_id: MicrosoftThreatProtection
    data_types:
      - DeviceProcessEvents
entity_mappings:
  - entity_type: Host
    field_mappings:
      - identifier: HostName
        column_name: DeviceName
  - entity_type: Process
    field_mappings:
      - identifier: CommandLine
        column_name: ProcessCommandLine
defender_xdr:
  period: 1H
  category: Persistence
  recommended_actions: >-
    Inspect web server logs and webroot files for webshells, verify patch status of the
    internet-facing application, and contain the host.
  impacted_assets:
    - type: device
      identifier: deviceId
      column: DeviceId
query: |
  DeviceProcessEvents
  | where InitiatingProcessFileName in~ ("w3wp.exe", "httpd", "apache2", "nginx", "tomcat9.exe", "java.exe")
  | where FileName in~ ("cmd.exe", "powershell.exe", "pwsh.exe", "sh", "bash", "whoami.exe", "whoami", "certutil.exe", "curl", "wget")
  | project Timestamp, DeviceId, DeviceName, AccountName, InitiatingProcessFileName, FileName, ProcessCommandLine, ReportId
false_positives:
  - Legacy CGI scripts or administrative web panels intentionally invoking shell helpers.
references:
  - https://www.cyber.gov.au/alert/critical-vulnerabilities-in-citrix-netscaler-adc-and-citrix-netscaler-gateway-products
  - https://learn.microsoft.com/en-us/defender-xdr/advanced-hunting-deviceprocessevents-table
